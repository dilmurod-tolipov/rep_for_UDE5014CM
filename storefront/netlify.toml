# Netlify settings for the Secret site (used when the site is connected to Git).
# Redirect and cache rules live in public/_redirects and public/_headers, so they
# also work for drag-and-drop deploys of the built "dist" folder.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
