# Scheduled collection of COMPETITOR catalogues every 12 hours (objective O1, ADR-005).
# Secret's own prices are not collected by this workflow (see the comment at the Secret step below).
#
# The APPROVED WINDOW is 2026-11-09 to 2026-12-06 inclusive (Module Leader, 2026-11-03). The job
# works out the purpose from the date rather than from a repository variable: inside the window a run
# is 'assessed', outside it the run is 'dev'. A date cannot be forgotten, and no assessed row can be
# created before approval or after the window closes - which is also why no test record can ever be
# relabelled as assessed data.
# Databases travel between runs as a workflow artifact; each run restores the previous one,
# collects, and uploads verified backups. Assessed runs require committed, unmodified code, which a
# fresh CI checkout always is.
name: collect

on:
  schedule:
    - cron: "0 3,15 * * *"   # 08:00 and 20:00 Asia/Tashkent (UTC+5), as approved
  workflow_dispatch:
    inputs:
      purpose:
        description: "dev or assessed"
        type: choice
        options: [dev, assessed]
        default: dev

permissions:
  contents: write        # to commit the assessed data snapshot
  actions: read          # to download the previous run's database artifact

concurrency:
  group: collector       # never two runs writing at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # kamilas is one request per product
    env:
      WINDOW_START: "2026-11-09"
      WINDOW_END: "2026-12-06"
      FORCED_PURPOSE: ${{ inputs.purpose }}
      TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Decide the purpose from the approved window
        shell: bash
        run: |
          # ISO dates compare correctly as strings, so no date arithmetic is needed.
          today=$(TZ=Asia/Tashkent date +%F)
          if [[ -n "$FORCED_PURPOSE" ]]; then
            purpose="$FORCED_PURPOSE"                                  # manual run: operator chose
          elif [[ "$today" < "$WINDOW_START" || "$today" > "$WINDOW_END" ]]; then
            purpose=dev                                                # outside the approved window
          else
            purpose=assessed
          fi
          echo "PURPOSE=$purpose" >> "$GITHUB_ENV"
          echo "Tashkent date $today, approved window $WINDOW_START..$WINDOW_END -> purpose=$purpose"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore databases from the newest stored artifact
        run: |
          mkdir -p data
          # Ask for the newest UNEXPIRED collector-db artifact rather than for the newest successful
          # run: a run can succeed and its artifact be gone (expired after 90 days, or deleted), and
          # that is a fresh start, not a failure. A download that fails when the artifact IS there
          # must still stop the run, because continuing would silently start an empty database.
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"                    --jq '[.artifacts[] | select(.name == "collector-db" and .expired == false)]
                         | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$prev" ]; then
            gh run download "$prev" --name collector-db --dir data               || { echo "::error::artifact of run $prev exists but could not be downloaded"; exit 1; }
            echo "restored databases from run $prev"
          else
            echo "no stored database artifact: starting new databases"
          fi
          ls -la data

      - run: python -m priceintel init-db

      - name: Collect competitor prices (all four operator groups)
        run: python -m priceintel collect --all --purpose "$PURPOSE" --trigger "$TRIGGER" || echo "::warning::competitor run did not succeed (status is recorded in scrape_runs)"

      # Secret's own prices are NOT collected here any more.
      # Reading the public Telegram channel (collect-secret) was disabled after Telegram's Content
      # Licensing and AI Scraping Terms were reviewed, as stated to the Module Leader on 26/10/2026.
      # Secret's offers will arrive instead as a separately identified reference dataset, imported
      # from the owner's own Telegram Desktop export, and will never be written into
      # price_observations (hence no snapshot-secret step either). See ADR-003 and the addendum.

      - name: Categories and coverage (Table 1) + cross-database integrity
        run: |
          python -m priceintel classify
          python -m priceintel category-report --purpose "$PURPOSE"
          python -m priceintel check-integrity

      - name: Verified backups
        run: python -m priceintel backup --out backup

      - uses: actions/upload-artifact@v4
        with:
          name: collector-db
          path: backup/*.db
          retention-days: 90
          if-no-files-found: error

      # Artifacts expire after 90 days and can be deleted; the assessed data must survive both, and
      # the brief requires a snapshot of the collected data inside the assessed commit. So every
      # assessed run writes the snapshot and commits it if anything changed.
      - name: Commit the assessed data snapshot
        if: env.PURPOSE == 'assessed'
        run: |
          python -m priceintel classify
          python -m priceintel quality --purpose assessed || true
          python -m priceintel snapshot --purpose assessed --label window
          git config user.name  "collector (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/assessed-window
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "Assessed data snapshot $(TZ=Asia/Tashkent date +%F' '%H:%M) (automated)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Summary
        run: python -m priceintel runs --limit 4
