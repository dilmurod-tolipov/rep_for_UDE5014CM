# Reachability probe for issue #6 (choose the scheduler host): can GitHub's runners fetch the
# sources, and do they get UZS prices? Manual only; dev purpose; nothing is committed back.
name: probe-sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m priceintel init-db
      - name: Competitor (uzflora, first page only)
        run: python -m priceintel collect --shop uzflora --purpose dev --max-pages 1 || true
      - name: Secret channel (last day only)
        run: python -m priceintel collect-secret --days 1 --purpose dev || true
      - name: uzflora default vs ?currency=UZS (first 3 cards)
        run: |
          python - <<'EOF2'
          import requests, time
          from priceintel.collect.http import USER_AGENT
          from priceintel.collect.parsers import uzflora
          for url in ("https://uzflora.com/shop/", "https://uzflora.com/shop/?currency=UZS"):
              html = requests.get(url, headers={"User-Agent": USER_AGENT}, timeout=30).text
              items = uzflora.parse(html, url).items[:3]
              print(url, [(i.title, i.price_text, i.currency) for i in items])
              time.sleep(6)
          EOF2
      - name: What was stored and rejected
        run: |
          python -m priceintel listings --limit 5
          python -m priceintel secret-prices --limit 3
          python - <<'EOF'
          from priceintel.db import connect
          m = connect("data/market_intel.db")
          print("fetch_log:", [tuple(r) for r in m.execute("SELECT url, http_status, bytes FROM fetch_log")])
          print("rejected rules:", [tuple(r) for r in m.execute("SELECT rule, COUNT(*) FROM rejected_records GROUP BY rule")])
          EOF
