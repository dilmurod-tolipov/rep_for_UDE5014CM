<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 206" class="chart" role="img"><style>
:root { --bg: #fbfaf8; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6762; --line: #e6e1db;
        --c1: #7d4f9c; --c2: #3f7f8f; --c3: #b07a3c; --c4: #8c6f5e; --c5: #5a7a4f;
        --up: #a33f5b; --down: #3f7f8f; }
.chart-title { font-size: 13px; fill: var(--ink); font-weight: 600; }
.tick, .axis-label { font-size: 11px; fill: var(--muted); }
.axis { stroke: var(--line); } .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.muted-text { font-size: 13px; fill: var(--muted); }
</style><desc>Where competitors disagree most about price is where a price position matters most.</desc><title>Figure 5. How far apart the groups are, per category</title><text x="0" y="16" class="chart-title">Figure 5. How far apart the groups are, per category</text><text x="182" y="48" text-anchor="end" class="tick">bouquets_unspecified</text><rect x="190.0" y="30" width="40.8" height="26" fill="var(--c1)" rx="3"><title>bouquets_unspecified: 383.5 % between the dearest and cheapest group median</title></rect><text x="236.8" y="48" text-anchor="start" class="tick">383.5</text><text x="182" y="80" text-anchor="end" class="tick">boxes_baskets</text><rect x="190.0" y="62" width="49.2" height="26" fill="var(--c2)" rx="3"><title>boxes_baskets: 462.3 % between the dearest and cheapest group median</title></rect><text x="245.2" y="80" text-anchor="start" class="tick">462.3</text><text x="182" y="112" text-anchor="end" class="tick">edible_sets</text><rect x="190.0" y="94" width="62.8" height="26" fill="var(--c3)" rx="3"><title>edible_sets: 590 % between the dearest and cheapest group median</title></rect><text x="258.8" y="112" text-anchor="start" class="tick">590</text><text x="182" y="144" text-anchor="end" class="tick">potted_plants</text><rect x="190.0" y="126" width="420.0" height="26" fill="var(--c4)" rx="3"><title>potted_plants: 4k % between the dearest and cheapest group median</title></rect><text x="616.0" y="144" text-anchor="start" class="tick">4k</text><text x="182" y="176" text-anchor="end" class="tick">roses_mono</text><rect x="190.0" y="158" width="38.8" height="26" fill="var(--c5)" rx="3"><title>roses_mono: 365 % between the dearest and cheapest group median</title></rect><text x="234.8" y="176" text-anchor="start" class="tick">365</text><text x="676" y="202" text-anchor="end" class="axis-label">% between the dearest and cheapest group median</text></svg>