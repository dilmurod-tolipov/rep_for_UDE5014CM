<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="1180" height="820" role="img" aria-label="Entity-relationship diagram of both databases">
<style>text { font-family: "Segoe UI", system-ui, sans-serif; fill: #1f2328; }.title { font-size: 19px; font-weight: 700; }.subtitle { font-size: 12.5px; fill: #57606a; }.zone-title { font-size: 13px; font-weight: 700; }.zone-note { font-size: 11.5px; fill: #57606a; }.tname { font-size: 12.5px; font-weight: 700; }.col { font-size: 11px; fill: #424a53; }.edge { stroke: #8c959f; stroke-width: 1.1; }.link { stroke: #cf222e; stroke-width: 1.6; stroke-dasharray: 6 4; }.linklabel { font-size: 11.5px; fill: #cf222e; }</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="24" class="title">Competitive Price Intelligence for a Tashkent Flower Shop — database design</text>
<text x="16" y="42" class="subtitle">Two SQLite databases, every table STRICT. Zones are what the data IS: collected evidence, derived, reference, or synthetic.</text>
<rect x="16" y="54" width="560" height="430" rx="8" fill="#1f6feb0d" stroke="#1f6feb" stroke-width="1.4"/>
<text x="30" y="76" class="zone-title" fill="#1f6feb">market_intel — collected competitor data (PRIMARY)</text>
<text x="30" y="92" class="zone-note">Every row produced by this project's own collector. This is the assessed data.</text>
<rect x="592" y="54" width="572" height="250" rx="8" fill="#8250df0d" stroke="#8250df" stroke-width="1.4"/>
<text x="606" y="76" class="zone-title" fill="#8250df">market_intel — derived analysis tables</text>
<text x="606" y="92" class="zone-note">Computed from the collected rows; rebuilt by the pipeline, never hand-edited.</text>
<rect x="592" y="318" width="572" height="166" rx="8" fill="#bf87000d" stroke="#bf8700" stroke-width="1.4"/>
<text x="606" y="340" class="zone-title" fill="#bf8700">market_intel — reference data (NOT primary)</text>
<text x="606" y="356" class="zone-note">Secret's own published prices, imported once. Excluded from every model by test.</text>
<rect x="16" y="516" width="1148" height="288" rx="8" fill="#cf222e0d" stroke="#cf222e" stroke-width="1.4"/>
<text x="30" y="538" class="zone-title" fill="#cf222e">secret_shop — operational core (SYNTHETIC fixtures only)</text>
<text x="30" y="554" class="zone-note">Secret keeps no digital order record. Every row is is_synthetic = 1, enforced by triggers.</text>
