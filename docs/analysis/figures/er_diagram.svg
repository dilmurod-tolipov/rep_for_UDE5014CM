<line x1="1116" y1="160" x2="1116" y2="574" class="link"/>
<text x="20" y="505" class="linklabel">analysis_categories ↔ categories is the only link between the two files. SQLite cannot enforce a foreign key across files, so it is checked in code: on every dashboard page load, by check-integrity, and by the tests.</text>
</svg>